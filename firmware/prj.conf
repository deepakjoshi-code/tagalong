# Zephyr configuration for the Tagalong tag.
# Rationale for the non-obvious choices is in docs/firmware/firmware-architecture.md
# and the privacy requirements in docs/adr/ADR-007-ble-privacy-model.md.

# --- Bluetooth -------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Tagalong"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# LE Secure Connections with bonding. Config and Control characteristics require
# encryption, so an unbonded phone can never reconfigure a child's tag.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y

# Resolvable private addresses, rotated, so the tag cannot be used to follow a
# child between places (ADR-007).
CONFIG_BT_PRIVACY=y
CONFIG_BT_RPA_TIMEOUT=900

CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=69

# --- Storage ---------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# 16 MB QSPI NOR holds the content pack and the optional name clip.
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# --- Sensors ---------------------------------------------------------------
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_LIS2DW12=y
CONFIG_LIS2DW12_TRIGGER_GLOBAL_THREAD=y
CONFIG_ADC=y

# --- Audio -----------------------------------------------------------------
CONFIG_I2S=y
CONFIG_I2S_NRFX=y

# --- Power -----------------------------------------------------------------
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
# The 30-day battery target depends on the CPU being asleep between FIFO
# watermarks; see docs/hardware/power-budget.md.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# --- Firmware update -------------------------------------------------------
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y

# --- Reliability -----------------------------------------------------------
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y
CONFIG_RESET_ON_FATAL_ERROR=y

# --- Logging ---------------------------------------------------------------
# PRIVACY: logs must never contain a child's name, a recorded clip, or an event
# history. Release builds ship with logging off entirely.
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LOG_MODE_MINIMAL=y

# --- Size ------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_NEWLIB_LIBC=n
